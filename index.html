<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programador de Bloques ESP32 Audio</title>
  
  <!-- Carga de versiones estables de Google Blockly -->
  <script src="https://unpkg.com/blockly@10.4.3/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/python_compressed.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/msg/es.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e88e5;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }
    .btn {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      margin-left: 10px;
      font-weight: bold;
    }
    .btn-connect { background-color: #ff9800; }
    .btn:disabled { background-color: #777; cursor: not-allowed; opacity: 0.6; }
    #main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      position: relative;
    }
    #blocklyDiv {
      width: 60%;
      height: 100%;
      position: relative;
    }
    #codeDiv {
      width: 40%;
      background-color: #1e1e1e;
      color: #00ff66;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    #codeDiv h3 { margin-top: 0; color: #fff; }
    pre {
      flex: 1;
      overflow: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      background-color: #111;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <header>
    <h2>ESP32 Voice Controller (MicroPython)</h2>
    <div>
      <button id="btnConnect" class="btn btn-connect">1. Conectar ESP32 (USB)</button>
      <button id="btnUpload" class="btn" disabled>2. Enviar Código a ESP32</button>
    </div>
  </header>

  <div id="main-container">
    <div id="blocklyDiv"></div>

    <div id="codeDiv">
      <h3>Código MicroPython Generado:</h3>
      <pre id="pythonCode"># Arrastra bloques al panel izquierdo para generar código...</pre>
    </div>
  </div>

  <!-- Definición de la Paleta de Bloques (Toolbox) -->
  <xml id="toolbox" style="display: none">
    <category name="Configuración" colour="#a55b80">
      <block type="esp32_inmp441_setup"></block>
    </category>
    <category name="Conectividad y Nube" colour="#009688">
      <block type="esp32_wifi_connect"></block>
      <block type="esp32_cloud_stt"></block>
      <block type="esp32_main_loop"></block>
    </category>
    <category name="Comandos Voz" colour="#5b67a5">
      <block type="esp32_on_command"></block>
    </category>
    <category name="Control Pines (GPIO)" colour="#5ba55b">
      <block type="esp32_digital_write"></block>
      <block type="esp32_analog_write"></block>
    </category>
    <category name="Lógica" colour="#5ba5a5">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="math_number"></block>
    </category>
  </xml>

  <script>
    document.addEventListener("DOMContentLoaded", function() {

      // --- 1. DEFINICIÓN DE BLOQUES DE HARDWARE Y NUBE ---

      // Configurar INMP441
      Blockly.Blocks['esp32_inmp441_setup'] = {
        init: function() {
          this.appendDummyInput()
              .appendField("Configurar Micrófono INMP441 (I2S)");
          this.appendDummyInput()
              .appendField("Pin SCK:")
              .appendField(new Blockly.FieldNumber(4), "SCK")
              .appendField("WS:")
              .appendField(new Blockly.FieldNumber(5), "WS")
              .appendField("SD:")
              .appendField(new Blockly.FieldNumber(6), "SD");
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour(300);
        }
      };

      python.pythonGenerator.forBlock['esp32_inmp441_setup'] = function(block, generator) {
        var sck = block.getFieldValue('SCK');
        var ws = block.getFieldValue('WS');
        var sd = block.getFieldValue('SD');
        return `import machine\n` +
               `audio_in = machine.I2S(0, sck=machine.Pin(${sck}), ws=machine.Pin(${ws}), sd=machine.Pin(${sd}), mode=machine.I2S.MASTER_RX, dataformat=machine.I2S.BITS16, format=machine.I2S.MONO, rate=16000, ibuf=10240)\n`;
      };

      // Conectar a WiFi
      Blockly.Blocks['esp32_wifi_connect'] = {
        init: function() {
          this.appendDummyInput()
              .appendField("Conectar a WiFi")
              .appendField("SSID:")
              .appendField(new Blockly.FieldTextInput("MiRedWiFi"), "SSID")
              .appendField("Clave:")
              .appendField(new Blockly.FieldTextInput("12345678"), "PASS");
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour(180);
        }
      };

      python.pythonGenerator.forBlock['esp32_wifi_connect'] = function(block, generator) {
        var ssid = block.getFieldValue('SSID');
        var pass = block.getFieldValue('PASS');
        return `import network, time\n` +
               `wlan = network.WLAN(network.STA_IF)\n` +
               `wlan.active(True)\n` +
               `if not wlan.isconnected():\n` +
               `    wlan.connect('${ssid}', '${pass}')\n` +
               `    while not wlan.isconnected():\n` +
               `        time.sleep(0.5)\n`;
      };

      // Escuchar Audio y Enviar a la Nube (API STT)
      Blockly.Blocks['esp32_cloud_stt'] = {
        init: function() {
          this.appendDummyInput()
              .appendField("Escuchar Voz y Procesar en Nube (API)")
              .appendField("URL API:")
              .appendField(new Blockly.FieldTextInput("https://api.tu-servidor.com/stt"), "URL");
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour(180);
        }
      };

     python.pythonGenerator.forBlock['esp32_cloud_stt'] = function(block, generator) {
       var url = block.getFieldValue('URL');
       generator.definitions_['import_urequests'] = 'import urequests';
       return `audio_buffer = bytearray(32000)\n` +
              `audio_in.readinto(audio_buffer)\n` +
              `try:\n` +
              `    res = urequests.post('${url}', data=audio_buffer, headers={'Content-Type': 'audio/raw'})\n` +
              `    comando_detectado = int(res.json().get('comando_id', 0))\n` +
              `    res.close()\n` +
              `except:\n` +
              `    comando_detectado = 0\n`;
   };

      // Bucle Principal (Loop Infinito)
      Blockly.Blocks['esp32_main_loop'] = {
        init: function() {
          this.appendDummyInput()
              .appendField("Repetir continuamente (Bucle Principal)");
          this.appendStatementInput("DO")
              .appendField("Hacer:");
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour(180);
        }
      };

      python.pythonGenerator.forBlock['esp32_main_loop'] = function(block, generator) {
        var branch = generator.statementToCode(block, 'DO');
        return `comando_detectado = 0\nwhile True:\n` + (branch || '    pass\n');
      };

      // Evento Al recibir Comando
      Blockly.Blocks['esp32_on_command'] = {
        init: function() {
          this.appendDummyInput()
              .appendField("Si Comando de Voz es igual a:")
              .appendField(new Blockly.FieldNumber(1, 1, 10), "CMD_NUM");
          this.appendStatementInput("DO")
              .appendField("Hacer:");
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour(230);
        }
      };

      python.pythonGenerator.forBlock['esp32_on_command'] = function(block, generator) {
        var cmdNum = block.getFieldValue('CMD_NUM');
        var branch = generator.statementToCode(block, 'DO');
        return `if comando_detectado == ${cmdNum}:\n` + (branch || '    pass\n');
      };

      // Salida Digital
      Blockly.Blocks['esp32_digital_write'] = {
        init: function() {
          this.appendDummyInput()
              .appendField("Establecer Pin Digital")
              .appendField(new Blockly.FieldNumber(10), "PIN")
              .appendField("en")
              .appendField(new Blockly.FieldDropdown([["ALTO (1)","1"], ["BAJO (0)","0"]]), "STATE");
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour(120);
        }
      };

      python.pythonGenerator.forBlock['esp32_digital_write'] = function(block, generator) {
        var pin = block.getFieldValue('PIN');
        var state = block.getFieldValue('STATE');
        return `machine.Pin(${pin}, machine.Pin.OUT).value(${state})\n`;
      };

      // Salida Analógica (PWM)
      Blockly.Blocks['esp32_analog_write'] = {
        init: function() {
          this.appendDummyInput()
              .appendField("Establecer Pin PWM")
              .appendField(new Blockly.FieldNumber(11), "PIN")
              .appendField("Valor (0-1023):")
              .appendField(new Blockly.FieldNumber(512, 0, 1023), "VAL");
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour(120);
        }
      };

      python.pythonGenerator.forBlock['esp32_analog_write'] = function(block, generator) {
        var pin = block.getFieldValue('PIN');
        var val = block.getFieldValue('VAL');
        return `machine.PWM(machine.Pin(${pin}), freq=1000).duty(${val})\n`;
      };

      // --- 2. INICIALIZAR ESPACIO DE TRABAJO ---
      var workspace = Blockly.inject('blocklyDiv', {
        toolbox: document.getElementById('toolbox'),
        scrollbars: true,
        zoom: { controls: true, wheel: true }
      });

      function updateCode() {
        var code = python.pythonGenerator.workspaceToCode(workspace);
        document.getElementById('pythonCode').textContent = code || "# Arrastra bloques al panel izquierdo para generar código...";
      }
      workspace.addChangeListener(updateCode);

      window.addEventListener('resize', function() {
        Blockly.svgResize(workspace);
      });

      // --- 3. CONEXIÓN WEB SERIAL (Chrome/Edge) ---
      let port;

      document.getElementById('btnConnect').addEventListener('click', async () => {
        if (!("serial" in navigator)) {
          alert("Tu navegador no soporta Web Serial API. Usa Google Chrome o Microsoft Edge.");
          return;
        }
        try {
          port = await navigator.serial.requestPort();
          await port.open({ baudRate: 115200 });
          document.getElementById('btnConnect').innerText = "✓ ESP32 Conectada";
          document.getElementById('btnConnect').style.backgroundColor = "#2196F3";
          document.getElementById('btnUpload').disabled = false;
        } catch (err) {
          console.error("Error al conectar:", err);
          alert("No se pudo conectar con el dispositivo serie.");
        }
      });

      document.getElementById('btnUpload').addEventListener('click', async () => {
        if (!port) return;
        
        const code = python.pythonGenerator.workspaceToCode(workspace);
        const encoder = new TextEncoder();
        const writer = port.writable.getWriter();

        try {
          await writer.write(encoder.encode("\x03")); // Interrupt (Ctrl+C)
          await new Promise(r => setTimeout(r, 200));
          await writer.write(encoder.encode("\x05")); // Enter Paste mode (Ctrl+E)
          await new Promise(r => setTimeout(r, 200));
          await writer.write(encoder.encode(code));   // Transmitir código
          await new Promise(r => setTimeout(r, 200));
          await writer.write(encoder.encode("\x04")); // Execute (Ctrl+D)

          alert("¡Código enviado con éxito a la ESP32!");
        } catch (err) {
          console.error("Error transmitiendo código:", err);
          alert("Ocurrió un error enviando el código a la tarjeta.");
        } finally {
          writer.releaseLock();
        }
      });

    });
  </script>
</body>
</html>
